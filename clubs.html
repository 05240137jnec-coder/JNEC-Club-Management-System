<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Clubs | JNEC Clubs</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="clubs" data-layout="public">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main">
    <section class="page-header position-relative overflow-hidden text-white">
      <!-- College photo background (Bootstrap utilities: full-size image + dark tint behind the content) -->
      <img src="image/images.jpeg" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover z-0">
      <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-25 z-1"></div>
      <div class="container position-relative z-2">
        <h1 class="h2 fw-bold mb-1">Explore JNEC Clubs</h1>
        <p class="mb-0 opacity-75">Find a club that matches your interests and apply to join.</p>
      </div>
    </section>
    <section class="container py-4">
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label for="clubSearch" class="form-label small">Search</label>
            <div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="clubSearch" placeholder="Search by name, description or category"></div>
          </div>
          <div class="col-6 col-md-3">
            <label for="clubCategory" class="form-label small">Category</label>
            <select class="form-select" id="clubCategory"><option value="">All categories</option></select>
          </div>
          <div class="col-6 col-md-3">
            <label for="clubSort" class="form-label small">Sort by</label>
            <select class="form-select" id="clubSort">
              <option value="name-asc">Name (A–Z)</option>
              <option value="name-desc">Name (Z–A)</option>
              <option value="members">Most members</option>
              <option value="events">Most upcoming events</option>
            </select>
          </div>
        </div>
      </div>
      <p class="text-muted small mb-3" id="clubCount" aria-live="polite"></p>
      <div class="row g-4" id="clubGrid"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clubs.js"></script>
  <script src="js/events.js"></script>
  <script src="js/member.js"></script>
  <script src="js/management.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
