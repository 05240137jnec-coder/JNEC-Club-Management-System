<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Announcements | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="manage-announcements" data-layout="dashboard" data-root="../" data-role="secretary admin" data-title="Announcements">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="filter-bar mb-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-5">
              <label for="annSearch" class="form-label small">Search</label>
              <input type="search" class="form-control" id="annSearch" placeholder="Search announcements">
            </div>
            <div class="col-md-4">
              <label for="annScope" class="form-label small">Audience</label>
              <select class="form-select" id="annScope"></select>
            </div>
            <div class="col-md-3 d-grid">
              <button class="btn btn-primary" id="newAnnouncement"><i class="bi bi-megaphone me-1"></i>New announcement</button>
            </div>
          </div>
        </div>
        <div id="annList"></div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>
  <div class="modal fade" id="announceModal" tabindex="-1" aria-labelledby="announceModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable ">
      <form class="modal-content" id="announceForm">
      <div class="modal-header">
        <h2 class="modal-title h5" id="announceModalTitle">Publish announcement</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="anAudience" class="form-label">Send to</label>
          <select class="form-select" id="anAudience" name="clubId"></select>
        </div>
        <div class="mb-3">
          <label for="anTitle" class="form-label">Title</label>
          <input type="text" class="form-control" id="anTitle" name="title" required minlength="5" maxlength="100">
          <div class="invalid-feedback">Title is required (at least 5 characters).</div>
        </div>
        <div class="mb-3">
          <label for="anPriority" class="form-label">Priority</label>
          <select class="form-select" id="anPriority" name="priority" required>
            <option value="normal">Normal</option>
            <option value="important">Important</option>
          </select>
        </div>
        <div>
          <label for="anMessage" class="form-label">Message</label>
          <textarea class="form-control" id="anMessage" name="message" rows="5" required minlength="10" maxlength="600"></textarea>
          <div class="d-flex field-help"><div class="invalid-feedback">Write a message of at least 10 characters.</div><small class="text-muted ms-auto" id="annMsgCount">0/600</small></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Publish</button>
      </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
