<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Reports | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="reports" data-layout="dashboard" data-root="../" data-role="secretary admin" data-title="Reports">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="filter-bar mb-3 no-print">
          <div class="row g-2 align-items-end">
            <div class="col-md-4 scope-filter">
              <label for="reportClub" class="form-label small">Club</label>
              <select class="form-select" id="reportClub"></select>
            </div>
            <div class="col-md-4">
              <label for="reportPeriod" class="form-label small">Period</label>
              <select class="form-select" id="reportPeriod">
                <option value="all">All time</option>
                <option value="30">Last 30 days (+ upcoming)</option>
                <option value="90">Last 90 days (+ upcoming)</option>
                <option value="180">Last 6 months (+ upcoming)</option>
              </select>
            </div>
            <div class="col-md-4 d-flex gap-2">
              <button class="btn btn-outline-primary flex-fill" id="printReport"><i class="bi bi-printer me-1"></i>Print</button>
              <button class="btn btn-primary flex-fill" id="exportReport"><i class="bi bi-download me-1"></i>Export CSV</button>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <h2 class="h5 mb-0" id="reportHeading">Report</h2>
          <small class="text-muted" id="reportDate"></small>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon blue"><i class="bi bi-people"></i></span>
              <div><div class="stat-value" id="rMembers">0</div><div class="stat-label">Active members</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon green"><i class="bi bi-calendar-check"></i></span>
              <div><div class="stat-value" id="rEvents">0</div><div class="stat-label">Events held</div><small class="text-muted" id="rUpcoming"></small></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon gold"><i class="bi bi-clipboard-check"></i></span>
              <div><div class="stat-value" id="rAttendance">0</div><div class="stat-label">Attendance rate</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon red"><i class="bi bi-star"></i></span>
              <div><div class="stat-value" id="rRating">0</div><div class="stat-label">Average rating</div><small class="text-muted" id="rFeedbackCount"></small></div>
            </div></div>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-lg-6"><section class="card h-100"><div class="card-body"><h3 class="h6 section-title" id="chart1Title">Members</h3><div id="chart1"></div></div></section></div>
          <div class="col-lg-6"><section class="card h-100"><div class="card-body"><h3 class="h6 section-title">Attendance breakdown</h3><div id="chart2"></div></div></section></div>
          <div class="col-12"><section class="card"><div class="card-body"><h3 class="h6 section-title">Attendance rate per completed event</h3><div id="chart3"></div></div></section></div>
        </div>

        <section class="card mb-4">
          <div class="card-header"><h3 class="h6 mb-0">Event summary</h3></div>
          <div class="table-responsive"><table class="table mb-0">
            <thead><tr><th scope="col">Event</th><th scope="col">Club</th><th scope="col">Date</th><th scope="col">Registered</th><th scope="col">Attended</th><th scope="col">Rate</th><th scope="col">Status</th></tr></thead>
            <tbody id="eventSummaryBody"></tbody>
          </table></div>
        </section>

        <div class="row g-4">
          <div class="col-lg-5"><section class="card h-100"><div class="card-header"><h3 class="h6 mb-0">Most active members</h3></div><ul class="list-group list-group-flush" id="topMembers"></ul></section></div>
          <div class="col-lg-7"><section class="card h-100"><div class="card-header"><h3 class="h6 mb-0">Member feedback</h3></div><div class="card-body py-0" id="reportFeedback"></div></section></div>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
