<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Member Management | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="manage-members" data-layout="dashboard" data-root="../" data-role="secretary admin" data-title="Member Management">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="filter-bar mb-3">
          <div class="row g-2 align-items-end">
            <!-- "scope-filter" is hidden automatically when the user manages only one club -->
            <div class="col-md-3 scope-filter">
              <label for="memberClub" class="form-label small">Club</label>
              <select class="form-select" id="memberClub"></select>
            </div>
            <div class="col-md-5">
              <label for="memberSearch" class="form-label small">Search students</label>
              <input type="search" class="form-control" id="memberSearch" placeholder="Name, student ID, email or department">
            </div>
            <div class="col-md-2">
              <label for="memberSort" class="form-label small">Sort members</label>
              <select class="form-select" id="memberSort"><option value="name">Name</option><option value="recent">Newest</option><option value="attendance">Attendance</option></select>
            </div>
            <div class="col-md-2 d-grid">
              <button class="btn btn-outline-primary" id="exportMembers"><i class="bi bi-download me-1"></i>Export CSV</button>
            </div>
          </div>
        </div>

        <ul class="nav nav-pills mb-3" role="tablist">
          <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabRequests" type="button" role="tab" aria-controls="tabRequests" aria-selected="true">Requests <span class="badge text-bg-warning" id="pendingCount">0</span></button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabMembers" type="button" role="tab" aria-controls="tabMembers" aria-selected="false">Members <span class="badge text-bg-light" id="memberCount">0</span></button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabHistory" type="button" role="tab" aria-controls="tabHistory" aria-selected="false">Decision history</button></li>
        </ul>

        <div class="tab-content">
          <section class="tab-pane fade show active card" id="tabRequests" role="tabpanel">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h2 class="h6 mb-0">Pending membership requests</h2>
              <button class="btn btn-success btn-sm" id="approveAll"><i class="bi bi-check2-all me-1"></i>Approve all</button>
            </div>
            <div class="table-responsive"><table class="table mb-0">
              <thead><tr><th scope="col">Student</th><th scope="col" class="club-col">Club</th><th scope="col">Department</th><th scope="col">Reason</th><th scope="col">Applied</th><th scope="col" class="text-end">Decision</th></tr></thead>
              <tbody id="requestsBody"></tbody>
            </table></div>
          </section>
          <section class="tab-pane fade card" id="tabMembers" role="tabpanel">
            <div class="card-header"><h2 class="h6 mb-0">Club members</h2></div>
            <div class="table-responsive"><table class="table mb-0">
              <thead><tr><th scope="col">Member</th><th scope="col" class="club-col">Club</th><th scope="col">Student ID</th><th scope="col">Department</th><th scope="col">Member since</th><th scope="col">Attendance</th><th scope="col" class="text-end">Remove</th></tr></thead>
              <tbody id="membersBody"></tbody>
            </table></div>
          </section>
          <section class="tab-pane fade card" id="tabHistory" role="tabpanel">
            <div class="card-header"><h2 class="h6 mb-0">Approved and rejected applications</h2></div>
            <div class="table-responsive"><table class="table mb-0">
              <thead><tr><th scope="col">Student</th><th scope="col" class="club-col">Club</th><th scope="col">Applied</th><th scope="col">Decided</th><th scope="col">Result</th></tr></thead>
              <tbody id="historyBody"></tbody>
            </table></div>
          </section>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
