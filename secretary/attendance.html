<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Attendance Management | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="manage-attendance" data-layout="dashboard" data-root="../" data-role="secretary admin" data-title="Attendance Management">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div id="attendanceArea">
          <div class="filter-bar mb-3">
            <div class="row g-2 align-items-end">
              <div class="col-lg-6">
                <label for="attEvent" class="form-label small">Event</label>
                <select class="form-select" id="attEvent"></select>
              </div>
              <div class="col-lg-3">
                <label for="attSearch" class="form-label small">Search attendee</label>
                <input type="search" class="form-control" id="attSearch" placeholder="Name or student ID">
              </div>
              <div class="col-lg-3 d-flex gap-2">
                <button class="btn btn-outline-success flex-fill" id="markAllPresent"><i class="bi bi-check2-all me-1"></i>All present</button>
                <button class="btn btn-primary flex-fill" id="saveAttendance"><i class="bi bi-save me-1"></i>Save</button>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-3 small text-muted mt-3" id="attEventInfo"></div>
          </div>

          <div class="alert alert-info d-none" id="futureWarning"><i class="bi bi-info-circle me-1"></i>This event has not taken place yet. Attendance can be marked on or after the event date.</div>

          <div class="row g-3 mb-3 text-center">
            <div class="col-6 col-md-3"><div class="card"><div class="card-body py-2"><div class="stat-value text-success" id="count-present">0</div><small class="text-muted">Present</small></div></div></div>
            <div class="col-6 col-md-3"><div class="card"><div class="card-body py-2"><div class="stat-value text-warning" id="count-late">0</div><small class="text-muted">Late</small></div></div></div>
            <div class="col-6 col-md-3"><div class="card"><div class="card-body py-2"><div class="stat-value text-danger" id="count-absent">0</div><small class="text-muted">Absent</small></div></div></div>
            <div class="col-6 col-md-3"><div class="card"><div class="card-body py-2"><div class="stat-value text-secondary" id="count-unmarked">0</div><small class="text-muted">Not marked</small></div></div></div>
          </div>

          <section class="card">
            <div class="card-header"><h2 class="h6 mb-0">Attendance sheet <small class="text-muted fw-normal">— highlighted rows have unsaved changes</small></h2></div>
            <div class="table-responsive"><table class="table mb-0">
              <thead><tr><th scope="col">Student</th><th scope="col">Department</th><th scope="col">Type</th><th scope="col" class="text-end">Attendance</th></tr></thead>
              <tbody id="attBody"></tbody>
            </table></div>
            <div class="card-footer bg-white" id="walkInGroup">
              <div class="input-group" style="max-width:520px">
                <label for="walkInSelect" class="visually-hidden">Add walk-in attendee</label>
                <select class="form-select" id="walkInSelect"></select>
                <button class="btn btn-outline-primary" id="addWalkIn"><i class="bi bi-person-plus me-1"></i>Add walk-in</button>
              </div>
            </div>
          </section>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
