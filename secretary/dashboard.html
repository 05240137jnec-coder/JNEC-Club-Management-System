<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Secretary Dashboard | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="sec-dashboard" data-layout="dashboard" data-root="../" data-role="secretary" data-title="Secretary Dashboard">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="welcome-banner mb-4" id="clubBanner"></div>
        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon blue"><i class="bi bi-people"></i></span>
              <div><div class="stat-value" id="statMembers">0</div><div class="stat-label">Club members</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon gold"><i class="bi bi-hourglass-split"></i></span>
              <div><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending requests</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon green"><i class="bi bi-calendar-event"></i></span>
              <div><div class="stat-value" id="statUpcoming">0</div><div class="stat-label">Upcoming events</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon red"><i class="bi bi-clipboard-check"></i></span>
              <div><div class="stat-value" id="statAttendance">0</div><div class="stat-label">Average attendance</div></div>
            </div></div>
          </div>
        </div>
        <div class="row g-4">
          <div class="col-xl-7">
            <section class="card mb-4">
              <div class="card-header d-flex justify-content-between align-items-center"><h2 class="h6 mb-0">Membership requests</h2><a class="small" href="members.html">Manage members</a></div>
              <ul class="list-group list-group-flush" id="pendingList"></ul>
            </section>
            <section class="card">
              <div class="card-header"><h2 class="h6 mb-0">Quick actions</h2></div>
              <div class="card-body d-flex flex-wrap gap-2">
                <a class="btn btn-primary btn-sm" href="events.html?new=1"><i class="bi bi-calendar-plus me-1"></i>Create event</a>
                <a class="btn btn-outline-primary btn-sm" href="announcements.html?new=1"><i class="bi bi-megaphone me-1"></i>Publish announcement</a>
                <a class="btn btn-outline-primary btn-sm" href="attendance.html"><i class="bi bi-clipboard-check me-1"></i>Mark attendance</a>
                <a class="btn btn-outline-primary btn-sm" href="reports.html"><i class="bi bi-bar-chart-line me-1"></i>View reports</a>
              </div>
            </section>
          </div>
          <div class="col-xl-5">
            <section class="card mb-4">
              <div class="card-header d-flex justify-content-between align-items-center"><h2 class="h6 mb-0">Upcoming events</h2><a class="small" href="events.html">Manage events</a></div>
              <ul class="list-group list-group-flush" id="upcomingList"></ul>
            </section>
            <section class="card">
              <div class="card-header"><h2 class="h6 mb-0">Recent feedback</h2></div>
              <div class="card-body" id="recentFeedback"></div>
            </section>
          </div>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
