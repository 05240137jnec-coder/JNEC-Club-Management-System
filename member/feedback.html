<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Feedback | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="feedback" data-layout="dashboard" data-root="../" data-role="member" data-title="Feedback">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="row g-4">
          <div class="col-lg-5">
            <section class="card">
              <div class="card-header"><h2 class="h6 mb-0"><i class="bi bi-chat-square-heart me-2"></i>Share your feedback</h2></div>
              <div class="card-body">
                <form id="feedbackForm" class="row g-3">
                  <div class="col-12">
                    <label for="fbClub" class="form-label">Club</label>
                    <select class="form-select" id="fbClub" name="clubId" required></select>
                    <div class="invalid-feedback">Please choose a club.</div>
                  </div>
                  <div class="col-12">
                    <label for="fbEvent" class="form-label">Event <span class="text-muted small">(optional)</span></label>
                    <select class="form-select" id="fbEvent" name="eventId"><option value="">General (not about a specific event)</option></select>
                  </div>
                  <div class="col-12">
                    <label for="fbCategory" class="form-label">Type</label>
                    <select class="form-select" id="fbCategory" name="category" required>
                      <option value="">Choose…</option>
                      <option>Event</option>
                      <option>Club Activity</option>
                      <option>Suggestion</option>
                      <option>Complaint</option>
                    </select>
                    <div class="invalid-feedback">Please choose a feedback type.</div>
                  </div>
                  <div class="col-12">
                    <span class="form-label d-block" id="ratingLabel">Rating</span>
                    <!-- Stars are listed 5 → 1 because CSS shows them in reverse (row-reverse) -->
                    <div class="rating-input" role="radiogroup" aria-labelledby="ratingLabel">
                      <input type="radio" name="rating" id="star5" value="5" required><label for="star5" title="5 stars"><i class="bi bi-star-fill"></i><span class="visually-hidden">5 stars</span></label>
                      <input type="radio" name="rating" id="star4" value="4"><label for="star4" title="4 stars"><i class="bi bi-star-fill"></i><span class="visually-hidden">4 stars</span></label>
                      <input type="radio" name="rating" id="star3" value="3"><label for="star3" title="3 stars"><i class="bi bi-star-fill"></i><span class="visually-hidden">3 stars</span></label>
                      <input type="radio" name="rating" id="star2" value="2"><label for="star2" title="2 stars"><i class="bi bi-star-fill"></i><span class="visually-hidden">2 stars</span></label>
                      <input type="radio" name="rating" id="star1" value="1"><label for="star1" title="1 star"><i class="bi bi-star-fill"></i><span class="visually-hidden">1 star</span></label>
                    </div>
                    <div class="invalid-feedback rating-feedback">Please choose a rating.</div>
                  </div>
                  <div class="col-12">
                    <label for="fbMessage" class="form-label">Your comments</label>
                    <textarea class="form-control" id="fbMessage" name="message" rows="4" required minlength="10" maxlength="500" placeholder="What went well? What could be improved?"></textarea>
                    <div class="d-flex field-help"><div class="invalid-feedback">Please write at least 10 characters.</div><small class="text-muted ms-auto" id="msgCount">0/500</small></div>
                  </div>
                  <div class="col-12"><button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Submit feedback</button></div>
                </form>
              </div>
            </section>
          </div>
          <div class="col-lg-7 feedback-lists">
            <section class="card">
              <div class="card-header p-0">
                <ul class="nav nav-tabs card-header-tabs m-0 px-3 pt-2" role="tablist">
                  <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabCommunity" type="button" role="tab" aria-controls="tabCommunity" aria-selected="true">Community feedback</button></li>
                  <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMine" type="button" role="tab" aria-controls="tabMine" aria-selected="false">My feedback</button></li>
                </ul>
              </div>
              <div class="card-body tab-content">
                <div class="tab-pane fade show active" id="tabCommunity" role="tabpanel">
                  <label for="fbFilter" class="visually-hidden">Filter by club</label>
                  <select class="form-select form-select-sm mb-2" id="fbFilter" style="max-width:260px"><option value="">All clubs</option></select>
                  <div id="communityFeedback"></div>
                </div>
                <div class="tab-pane fade" id="tabMine" role="tabpanel"><div id="myFeedback"></div></div>
              </div>
            </section>
          </div>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
