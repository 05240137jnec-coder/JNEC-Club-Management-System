<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Announcements | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="announcements" data-layout="dashboard" data-root="../" data-role="member" data-title="Announcements">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="filter-bar mb-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="annSearch" class="form-label small">Search</label>
              <input type="search" class="form-control" id="annSearch" placeholder="Search announcements">
            </div>
            <div class="col-6 col-md-3">
              <label for="annClub" class="form-label small">Source</label>
              <select class="form-select" id="annClub"><option value="">All sources</option></select>
            </div>
            <div class="col-6 col-md-2">
              <label for="annPriority" class="form-label small">Priority</label>
              <select class="form-select" id="annPriority"><option value="">All</option><option value="important">Important</option><option value="normal">Normal</option></select>
            </div>
            <div class="col-md-3 d-flex align-items-center justify-content-between gap-2">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="annUnread">
                <label class="form-check-label small" for="annUnread">Unread only</label>
              </div>
              <button class="btn btn-outline-primary btn-sm mb-1" id="markAllRead"><i class="bi bi-check2-all me-1"></i>Mark all read</button>
            </div>
          </div>
        </div>
        <p class="small text-muted"><i class="bi bi-bell me-1"></i>You have <strong id="unreadCount">0</strong> unread announcement(s).</p>
        <div id="announcementList" aria-live="polite"></div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
