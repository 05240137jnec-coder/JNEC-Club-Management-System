<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Attendance History | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="attendance-history" data-layout="dashboard" data-root="../" data-role="member" data-title="Attendance History">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon blue"><i class="bi bi-graph-up"></i></span>
              <div><div class="stat-value" id="attRate">0</div><div class="stat-label">Overall attendance</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon green"><i class="bi bi-check-circle"></i></span>
              <div><div class="stat-value" id="attPresent">0</div><div class="stat-label">Present</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon gold"><i class="bi bi-clock-history"></i></span>
              <div><div class="stat-value" id="attLate">0</div><div class="stat-label">Late</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card h-100"><div class="card-body">
              <span class="stat-icon red"><i class="bi bi-x-circle"></i></span>
              <div><div class="stat-value" id="attAbsent">0</div><div class="stat-label">Absent</div></div>
            </div></div>
          </div>
        </div>
        <section class="card">
          <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <h2 class="h6 mb-0">My attendance records</h2>
            <div class="d-flex gap-2">
              <label for="attClub" class="visually-hidden">Filter by club</label>
              <select class="form-select form-select-sm" id="attClub"><option value="">All clubs</option></select>
              <label for="attStatus" class="visually-hidden">Filter by status</label>
              <select class="form-select form-select-sm" id="attStatus"><option value="">All statuses</option><option value="present">Present</option><option value="late">Late</option><option value="absent">Absent</option></select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table mb-0">
              <thead><tr><th scope="col">Event</th><th scope="col">Club</th><th scope="col">Date</th><th scope="col">Venue</th><th scope="col">Status</th></tr></thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>
        </section>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
