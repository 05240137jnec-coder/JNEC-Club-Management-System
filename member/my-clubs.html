<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>My Clubs | JNEC Clubs</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body data-page="my-clubs" data-layout="dashboard" data-root="../" data-role="member" data-title="My Clubs">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="app-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <p class="text-muted mb-0">Clubs you are an approved member of.</p>
          <a class="btn btn-primary btn-sm" href="join-club.html"><i class="bi bi-plus-lg me-1"></i>Join another club</a>
        </div>
        <div class="row g-4 mb-4" id="myClubGrid"></div>
        <section class="card">
          <div class="card-header"><h2 class="h6 mb-0">Pending & rejected applications</h2></div>
          <ul class="list-group list-group-flush" id="otherApplications"></ul>
        </section>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/clubs.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/member.js"></script>
  <script src="../js/management.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
