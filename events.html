<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Club Management System for Jigme Namgyel Engineering College, Dewathang">
  <title>Events | JNEC Clubs</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 + Bootstrap Icons (official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="events" data-layout="public">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main">
    <section class="page-header position-relative overflow-hidden text-white">
      <!-- College photo background (Bootstrap utilities: full-size image + dark tint behind the content) -->
      <img src="image/images.jpeg" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover z-0">
      <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-25 z-1"></div>
      <div class="container position-relative z-2">
        <h1 class="h2 fw-bold mb-1">Club Events</h1>
        <p class="mb-0 opacity-75">Workshops, competitions, cultural nights and more — register to reserve your seat.</p>
      </div>
    </section>
    <section class="container py-4">
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-lg-4">
            <label for="eventSearch" class="form-label small">Search</label>
            <div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="eventSearch" placeholder="Search events or venues"></div>
          </div>
          <div class="col-6 col-lg-2">
            <label for="eventClub" class="form-label small">Club</label>
            <select class="form-select" id="eventClub"><option value="">All clubs</option></select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="eventCategory" class="form-label small">Category</label>
            <select class="form-select" id="eventCategory"><option value="">All categories</option></select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="eventStatus" class="form-label small">Show</label>
            <select class="form-select" id="eventStatus">
              <option value="upcoming">Upcoming</option>
              <option value="completed">Past events</option>
              <option value="cancelled">Cancelled</option>
              <option value="all">All events</option>
            </select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="eventSort" class="form-label small">Sort by</label>
            <select class="form-select" id="eventSort">
              <option value="date-asc">Date (soonest)</option>
              <option value="date-desc">Date (latest)</option>
              <option value="title">Title (A–Z)</option>
              <option value="seats">Most seats left</option>
            </select>
          </div>
        </div>
      </div>
      <p class="text-muted small mb-3" id="eventCount" aria-live="polite"></p>
      <div class="row g-4" id="eventGrid"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <!-- Bootstrap JS, then our scripts (order matters: data -> main -> auth -> page modules) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/clubs.js"></script>
  <script src="js/events.js"></script>
  <script src="js/member.js"></script>
  <script src="js/management.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
